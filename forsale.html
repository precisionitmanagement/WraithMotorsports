<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wraith Motorsports — Garage Sale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --void: #080810;
      --card: #0d0d1a;
      --purple: #9944ff;
      --purple-dim: #6622cc;
      --silver: #c0c0c0;
      --white: #ffffff;
      --border: #1a1a2a;
      --text-dim: #888;
    }

    body {
      background: var(--void);
      color: var(--white);
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
      padding: 40px 24px 80px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── BACK LINK ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--purple-dim);
      text-decoration: none;
      text-transform: uppercase;
      margin-bottom: 40px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--purple); }

    /* ── HEADLINE ── */
    .headline {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(52px, 12vw, 110px);
      letter-spacing: 4px;
      line-height: 1;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #c8a8ff 20%,
        #9944ff 55%,
        #6622cc 80%,
        #2a0066 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    /* ── UNDERLINE ── */
    .headline-line {
      width: 180px;
      height: 2px;
      background: var(--purple-dim);
      margin-bottom: 20px;
    }

    /* ── SUBTITLE ── */
    .subtitle {
      font-size: 12px;
      letter-spacing: 6px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 48px;
      font-weight: 400;
    }

    /* ── FILTER TABS ── */
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .filter-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      border-color: var(--purple);
      color: var(--purple);
      background: #9944ff11;
    }

    .filter-btn:hover:not(.active) {
      border-color: #333;
      color: #ccc;
    }

    /* ── LISTING CARD ── */
    .listing-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px 32px;
      margin-bottom: 20px;
      display: none;
    }

    .listing-card.visible { display: block; }

    /* Category tag */
    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--purple-dim);
      border: 1px solid var(--purple-dim);
      border-radius: 4px;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    .category-tag::before {
      content: '◇';
      font-size: 10px;
    }

    /* Title + price row */
    .listing-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .listing-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(16px, 3vw, 22px);
      color: var(--white);
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .listing-price {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 2vw, 16px);
      color: var(--purple);
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Description */
    .listing-desc {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: 400;
    }

    /* PDF Button */
    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--purple-dim);
      border: 1px solid var(--purple-dim);
      border-radius: 4px;
      padding: 10px 18px;
      text-decoration: none;
      transition: all 0.2s;
      margin-bottom: 24px;
      cursor: pointer;
      background: transparent;
    }

    .pdf-btn:hover {
      background: #9944ff11;
      color: var(--purple);
      border-color: var(--purple);
    }

    .pdf-btn::before { content: '⊞'; font-size: 12px; }

    /* Divider */
    .card-divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 20px;
    }

    /* Contact row */
    .contact-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      color: var(--white);
      font-weight: 600;
    }

    .contact-email {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      color: var(--purple);
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-email:hover { color: #c8a8ff; }
    .contact-email::before { content: '✉'; font-size: 13px; }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 80px 20px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      display: none;
    }

    .empty.visible { display: block; }

    .empty-title {
      font-size: 11px;
      letter-spacing: 4px;
      color: #333;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .empty-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      color: #222;
    }
  </style>
</head>
<body>

  <!-- BACK LINK -->
  <a class="back-link" href="index.html">← Wraith Motorsports</a>

  <!-- HEADLINE -->
  <div class="headline">GARAGE SALE</div>
  <div class="headline-line"></div>
  <div class="subtitle">All Things Motorsports and More</div>

  <!-- LISTINGS -->
  <div id="listings">
    <!-- Rendered by JS -->
  </div>

  <!-- EMPTY STATE -->
  <div class="empty" id="emptyState">
    <div class="empty-title">No listings found</div>
    <div class="empty-sub">Check back soon for new items</div>
  </div>

<script>
// ── ADD YOUR LISTINGS HERE ──
const listings = [
  {
    id: 1,
    category: "complete-car",
    categoryLabel: "Complete Car",
    title: "2019 Can-Am Maverick X3 MAX",
    price: "Price in Listing",
    description: "See the attached PDF for full details, specs, and photos. Contact us for pricing.",
    pdfFile: "2019_CAN-AM_MAVERICK_X3_MAX.pdf",
    available: true,
  },
];

function renderListings(items) {
  const container = document.getElementById('listings');
  const empty = document.getElementById('emptyState');

  if (items.length === 0) {
    container.innerHTML = '';
    empty.classList.add('visible');
    return;
  }

  empty.classList.remove('visible');
  container.innerHTML = items.map(item => `
    <div class="listing-card visible" data-category="${item.category}">
      <div class="category-tag">${item.categoryLabel}</div>
      <div class="listing-header">
        <div class="listing-title">${item.title}</div>
        <div class="listing-price">${item.price}</div>
      </div>
      <div class="listing-desc">${item.description}</div>
      ${item.pdfFile
        ? `<a class="pdf-btn" href="${item.pdfFile}" target="_blank">View Full Details (PDF)</a>`
        : ''}
      <div class="card-divider"></div>
      <div class="contact-section">
        <div class="contact-name">Wraith Motorsports</div>
        <a class="contact-email" href="mailto:nick@wraithmotorsports.com?subject=Inquiry: ${encodeURIComponent(item.title)}">nick@wraithmotorsports.com</a>
      </div>
    </div>
  `).join('');
}

// Init
renderListings(listings);
</script>
</body>
</html>
